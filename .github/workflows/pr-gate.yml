name: pr-gate

# Reusable PR gate, inherited by every repo of the organization (docs/adr/0001).
# One job on purpose: every job is billed as at least one minute in a private repo.
#   1. the PR title is a Conventional Commit (the squash commit uses it)
#   2. the PR links an issue (Closes/Refs #N), unless it is a release or a dependency update
#   3. links in the Markdown and source files the PR changes answer (lychee, docs/adr/0002)
#   4. a non-draft PR into develop squash-merges itself, closes its issues and deletes its branch
# Step 4 is off until the caller repo has the variable AUTOMERGE_ENABLED=true; the label `hold` blocks it.
# The caller runs its own checks first and lists them in `needs:` of the job that calls this workflow.
on:
  workflow_call:
    inputs:
      issue_exempt_prefix:
        description: Head branches starting with this prefix need no linked issue (unattended automation, e.g. "jarvis/").
        type: string
        default: ""
      link_check:
        description: Check the links in the files the PR changes. Set false to skip it in a repo that is not ready.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      BASE: ${{ github.base_ref }}
      HEAD: ${{ github.head_ref }}
      PR_BODY: ${{ github.event.pull_request.body }}
      ACTOR: ${{ github.actor }}
      AUTOMERGE: ${{ vars.AUTOMERGE_ENABLED }}
      EXEMPT: ${{ inputs.issue_exempt_prefix }}
      LYCHEE_VERSION: "0.24.2"
    steps:
      - name: Conventional Commit title
        run: |
          printf '%s' "$PR_TITLE" | grep -Eq '^(feat|fix|docs|style|refactor|perf|test|chore|tune)(\([a-z0-9/_.-]+\))?!?: .+' \
            || { echo "::error::PR title must follow Conventional Commits: $PR_TITLE"; exit 1; }
      - name: Linked issue
        run: |
          case "$HEAD" in develop | release/* | dependabot/*) echo "release or dependency PR: no issue needed"; exit 0 ;; esac
          if [ -n "$EXEMPT" ]; then
            case "$HEAD" in "$EXEMPT"*) echo "automation branch ($EXEMPT): no issue needed"; exit 0 ;; esac
          fi
          body=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body)
          closing=$(gh pr view "$PR" --repo "$REPO" --json closingIssuesReferences --jq '.closingIssuesReferences | length')
          if [ "$closing" -gt 0 ] || printf '%s' "$body" | grep -Eiq '(closes|fixes|resolves|refs)[: ]+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+'; then
            exit 0
          fi
          echo "::error::The PR body must link an issue: 'Closes #N' or 'Refs #N'."
          exit 1
      - name: Checkout for the link check
        if: inputs.link_check
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Restore link cache
        if: inputs.link_check
        uses: actions/cache@v6
        with:
          path: .lycheecache
          key: lychee-${{ github.repository }}-${{ github.run_id }}
          restore-keys: lychee-${{ github.repository }}-
      - name: Links in the changed files
        if: inputs.link_check
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | select(.status != "removed") | .filename'             | grep -E '\.(md|mdx|html|txt|luau|lua|ps1)$' > "$RUNNER_TEMP/changed.txt" || true
          if [ ! -s "$RUNNER_TEMP/changed.txt" ]; then echo "no Markdown or source files changed: nothing to check"; exit 0; fi
          # Settings: the caller's .lychee.toml, else this repo's own sync/lychee.toml, else the organization default.
          if   [ -f .lychee.toml ];      then config=.lychee.toml
          elif [ -f sync/lychee.toml ];  then config=sync/lychee.toml
          else
            config="$RUNNER_TEMP/lychee.toml"
            curl -fsSL -o "$config" https://raw.githubusercontent.com/Nashei-Studios/.github/main/sync/lychee.toml
          fi
          base="https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}"
          asset="lychee-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$asset" -o "$RUNNER_TEMP/$asset.sha256" "$base/$asset" "$base/$asset.sha256"
          (cd "$RUNNER_TEMP" && sha256sum -c "$asset.sha256")
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-gnu/lychee
          mapfile -t files < "$RUNNER_TEMP/changed.txt"
          echo "checking ${#files[@]} file(s) with $config"
          "$RUNNER_TEMP/lychee" --config "$config" --no-progress -- "${files[@]}"             || { echo "::error::A link in the changed files is broken. Fix it, or add a justified exclusion to the lychee config."; exit 1; }
      - name: No AI marks
        run: |
          # ai-marks:begin
          # Reads text on stdin, prints "line-number:line" for each AI mark and fails if it finds any.
          # A Co-Authored-By of a person passes; one naming an assistant does not.
          ai_marks() {
            ! LC_ALL=C grep -nEi \
              -e '^[[:space:]]*co-authored-by:.*(claude|anthropic|openai|chatgpt|codex|copilot|gemini|cursor|aider|devin)' \
              -e 'claude-session:|claude\.ai/code/session_' \
              -e 'generated (with|by)[^a-z]{0,6}(claude|anthropic|codex|openai|chatgpt|copilot|gemini|cursor)' \
              -e '🤖'
          }
          # ai-marks:end
          bad=0
          check() {
            if ! hits=$(printf '%s\n' "$2" | ai_marks); then
              printf '%s\n' "$hits" | while IFS= read -r line; do
                echo "::error::AI mark in $1 (line ${line%%:*}): remove this line: ${line#*:}"
              done
              bad=1
            fi
          }
          check "the PR title" "$PR_TITLE"
          check "the PR description" "$PR_BODY"
          case "$HEAD" in
            develop | release/*) echo "release PR: its commits passed their own gate"; [ "$bad" = 0 ]; exit ;;
          esac
          gh api "repos/$REPO/pulls/$PR/commits" --paginate \
            --jq '.[] | "\(.sha[0:7])\t\(.commit.message | gsub("\n"; "\u001f"))"' > commits.tsv
          while IFS=$'\t' read -r sha msg; do
            check "commit $sha" "$(printf '%s' "$msg" | tr '\037' '\n')"
          done < commits.tsv
          [ "$bad" = 0 ]
      - name: Squash-merge into develop unless held
        if: github.base_ref == 'develop' && vars.AUTOMERGE_ENABLED == 'true' && github.actor != 'dependabot[bot]'
        run: |
          if gh pr view "$PR" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx hold; then
            echo "PR held by label, not merging"; exit 0
          fi
          # GitHub only resolves closing keywords for PRs into the default branch, so
          # closingIssuesReferences is empty here: the issues are read from the body. A reference
          # to another repository is left alone (the token cannot close it).
          issues=$(gh pr view "$PR" --repo "$REPO" --json body --jq .body \
            | grep -Eio '(close[sd]?|fix(e[sd])?|resolve[sd]?)[: ]+([A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+)?#[0-9]+' \
            | while read -r ref; do
                target=$(printf '%s' "$ref" | grep -Eo '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+' || true)
                if [ -z "$target" ] || [ "$target" = "$REPO" ]; then printf '%s\n' "${ref##*#}"; fi
              done | sort -un)
          # A merge made with GITHUB_TOKEN does not trigger the auto-delete of the head branch
          # either: the branch is deleted here.
          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch
          for issue in $issues; do
            gh issue close "$issue" --repo "$REPO" --comment "Closed by #$PR (automerge)."
          done
