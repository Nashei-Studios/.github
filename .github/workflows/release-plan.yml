name: release-plan

# Reusable first half of the release train (docs/adr/0001): decides whether develop holds something
# to release and which SemVer version comes next (git-cliff, Conventional Commits).
# A run with nothing to release ends here and costs about one minute.
on:
  workflow_call:
    outputs:
      release:
        description: "'true' when develop holds releasable commits since the last tag"
        value: ${{ jobs.plan.outputs.release }}
      version:
        description: "Next version, like v0.3.0"
        value: ${{ jobs.plan.outputs.version }}

permissions:
  contents: read

env:
  GIT_CLIFF_VERSION: "2.14.2"

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
      - name: Shared changelog config when the repo has none
        if: hashFiles('cliff.toml') == ''
        run: curl -fsSL -o "$RUNNER_TEMP/cliff.toml" https://raw.githubusercontent.com/Nashei-Studios/.github/main/sync/cliff.toml
      - name: Merge main locally so the last release tag is reachable
        # The tag sits on main's merge commit, which develop does not contain until the next release.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -m "chore(release): sync main into develop" origin/main
      - name: Install git-cliff (pinned, checksum verified)
        run: |
          base="https://github.com/orhun/git-cliff/releases/download/v${GIT_CLIFF_VERSION}"
          asset="git-cliff-${GIT_CLIFF_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -O "$base/$asset" -O "$base/$asset.sha512"
          sha512sum -c "$asset.sha512"
          tar -xzf "$asset" --strip-components=1 "git-cliff-${GIT_CLIFF_VERSION}/git-cliff"
          mkdir -p "$HOME/.local/bin" && mv git-cliff "$HOME/.local/bin/"
          rm -f "$asset" "$asset.sha512"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Decide whether there is something to release
        id: plan
        env:
          EVENT: ${{ github.event_name }}
        run: |
          config=cliff.toml; [ -f "$config" ] || config="$RUNNER_TEMP/cliff.toml"
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
          range=${last:+$last..}HEAD
          # The weekly run only releases real changes; an on-demand run releases any conventional commit.
          if [ "$EVENT" = "schedule" ]; then
            pattern='^(feat|fix|perf|tune)(\(.+\))?!?:'
          else
            pattern='^[a-z]+(\(.+\))?!?:'
          fi
          if git log "$range" --format=%s | grep -Ev '^chore\(release\)' | grep -Eq "$pattern"; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=$(git-cliff --config "$config" --bumped-version)" >> "$GITHUB_OUTPUT"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to release since ${last:-the start}"
          fi
